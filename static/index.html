<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YAML Sanitizer — tree-sitter</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #f5f5f3;
  --surface:    #ffffff;
  --border:     #d4d4d0;
  --accent:     #1a1a1a;
  --muted:      #6b6b6b;
  --error:      #c0392b;
  --ok:         #27ae60;
  --warn:       #e67e22;
  --info:       #2980b9;
  --fix-bg:     #fef9f0;
  --fix-border: #e8c97a;
  --mono:       "JetBrains Mono", "Fira Mono", "Consolas", monospace;
  --sans:       "Inter", "Helvetica Neue", Arial, sans-serif;
  --radius:     3px;
}

html, body { height: 100%; background: var(--bg); color: var(--accent);
  font-family: var(--sans); font-size: 14px; line-height: 1.5; }

.app { display: flex; flex-direction: column; height: 100vh; max-width: 1800px; margin: 0 auto; }

header {
  display: flex; align-items: baseline; gap: 12px;
  padding: 11px 16px; border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
}
header h1 { font-size: 14px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
header .sub { font-size: 11px; color: var(--muted); }
header .grammar-tag {
  margin-left: auto; font-size: 11px; font-family: var(--mono);
  color: var(--info); background: #eaf4fc; padding: 2px 7px;
  border-radius: 2px; border: 1px solid #b8d8f0;
}

.toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 16px; border-bottom: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0; flex-wrap: wrap;
}
.toolbar label { font-size: 12px; color: var(--muted); white-space: nowrap; }
.toolbar select {
  font-family: var(--sans); font-size: 13px; padding: 4px 8px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--accent); cursor: pointer;
  flex: 1; min-width: 180px; max-width: 400px;
}
.toolbar select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

.status-badge {
  margin-left: auto; font-size: 11px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 2px; white-space: nowrap;
}
.status-badge.clean  { background: #d4edda; color: var(--ok); }
.status-badge.errors { background: #fde8e8; color: var(--error); }
.status-badge.lint   { background: #fff3cd; color: var(--warn); }
.status-badge.idle   { background: #ebebeb; color: var(--muted); }

.panels { display: grid; grid-template-columns: 1fr 1.1fr 1fr; flex: 1; overflow: hidden; }

.panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; min-width: 0; }
.panel:last-child { border-right: none; }

.panel-header {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--surface);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.panel-header h2 {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
}
.badge {
  font-size: 10px; font-weight: 600; padding: 2px 6px;
  border-radius: 2px; background: #ebebeb; color: var(--muted);
}
.badge.has-errors { background: #fde8e8; color: var(--error); }
.badge.no-errors  { background: #d4edda; color: var(--ok); }
.badge.has-lint   { background: #fff3cd; color: var(--warn); }

.panel-body { flex: 1; overflow: auto; position: relative; }

#editor {
  width: 100%; height: 100%; padding: 12px;
  font-family: var(--mono); font-size: 13px; line-height: 1.65;
  border: none; outline: none; resize: none;
  background: var(--surface); color: var(--accent); tab-size: 2;
}

#tree-output {
  padding: 10px 12px; font-family: var(--mono); font-size: 11.5px;
  line-height: 1.65; white-space: pre; background: var(--surface);
  min-height: 100%; overflow-x: auto;
}
.tn-error   { color: var(--error); font-weight: 700; }
.tn-missing { color: var(--warn);  font-weight: 700; }
.tn-node    { color: #2c7bb6; }
.tn-field   { color: #7b5ea7; }
.tn-paren   { color: #aaa; }

.issues-section {
  border-top: 1px solid var(--border); background: #fff8f8;
  flex-shrink: 0; max-height: 200px; overflow-y: auto;
}
.issues-section.lint-only { background: #fffdf0; }
.issues-section h3 {
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
  padding: 6px 12px 4px; border-bottom: 1px solid #f0d0d0;
  position: sticky; top: 0; background: inherit;
}
.issues-section.lint-only h3 { border-bottom-color: #e8d88a; }
.issue-item {
  padding: 4px 12px; border-bottom: 1px solid #f0d0d0;
  font-size: 11.5px; font-family: var(--mono);
}
.issues-section.lint-only .issue-item { border-bottom-color: #e8d88a; }
.issue-item:last-child { border-bottom: none; }
.issue-item .loc { color: var(--muted); font-size: 10px; margin-right: 5px; }
.type-tag {
  display: inline-block; font-size: 9px; font-weight: 700;
  letter-spacing: .05em; text-transform: uppercase;
  padding: 1px 4px; border-radius: 2px; margin-right: 5px;
}
.type-tag.error   { background: #fde8e8; color: var(--error); }
.type-tag.missing { background: #fff3cd; color: var(--warn); }
.type-tag.lint    { background: #e8f4fd; color: var(--info); }

.sanitized-panel-body { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
#sanitized-output {
  flex: 1; padding: 12px; font-family: var(--mono); font-size: 13px;
  line-height: 1.65; white-space: pre-wrap; word-break: break-all;
  background: var(--surface); overflow: auto;
}

.fixes-section {
  border-top: 1px solid var(--border); background: var(--fix-bg);
  flex-shrink: 0; max-height: 240px; overflow-y: auto;
}
.fixes-section h3 {
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
  padding: 6px 12px 4px; border-bottom: 1px solid var(--fix-border);
  position: sticky; top: 0; background: var(--fix-bg);
}
.fix-item { padding: 6px 12px; border-bottom: 1px solid var(--fix-border); font-size: 12px; }
.fix-item:last-child { border-bottom: none; }
.fix-rule {
  display: inline-block; font-size: 9px; font-weight: 700;
  letter-spacing: .05em; text-transform: uppercase;
  background: var(--fix-border); color: #7a5c00;
  padding: 1px 5px; border-radius: 2px; margin-right: 6px;
  font-family: var(--mono);
}
.fix-desc { color: var(--accent); font-size: 12px; }
.fix-diff { margin-top: 5px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.fix-before, .fix-after {
  font-family: var(--mono); font-size: 11px; padding: 3px 6px;
  border-radius: 2px; white-space: pre-wrap; word-break: break-all;
}
.fix-before { background: #fde8e8; color: var(--error); }
.fix-after  { background: #d4edda; color: var(--ok); }

.spinner {
  display: inline-block; width: 10px; height: 10px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .6s linear infinite;
  margin-left: 4px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner.hidden { display: none; }

.empty { padding: 24px 12px; color: var(--muted); font-size: 12px; text-align: center; font-family: var(--sans); }

.btn {
  font-family: var(--sans); font-size: 10px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase;
  padding: 3px 8px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--bg);
  color: var(--muted); cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.active { background: #d4edda; color: var(--ok); border-color: var(--ok); }
.btn.copied { background: var(--ok); color: #fff; border-color: var(--ok); }

@media (max-width: 960px) {
  .panels { grid-template-columns: 1fr; overflow: auto; }
  .panel { border-right: none; border-bottom: 1px solid var(--border); min-height: 300px; max-height: 60vh; }
  .panel:last-child { border-bottom: none; }
}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>YAML Sanitizer</h1>
    <span class="sub">tree-sitter · heuristic repair</span>
    <span class="grammar-tag">tree-sitter-grammars/tree-sitter-yaml v0.7.2</span>
  </header>

  <div class="toolbar">
    <label for="example-select">Example</label>
    <select id="example-select">
      <option value="">— type your own YAML —</option>
    </select>
    <span id="status-badge" class="status-badge idle">idle</span>
    <span id="spinner" class="spinner hidden"></span>
  </div>

  <div class="panels">

    <!-- Panel 1: Input -->
    <div class="panel">
      <div class="panel-header">
        <h2>Input YAML</h2>
        <span id="input-badge" class="badge">—</span>
      </div>
      <div class="panel-body">
        <textarea id="editor" spellcheck="false" autocorrect="off" autocapitalize="off"
          placeholder="Paste or type broken YAML here…"></textarea>
      </div>
    </div>

    <!-- Panel 2: Parse tree -->
    <div class="panel">
      <div class="panel-header">
        <h2>Parse Tree</h2>
        <span id="tree-badge" class="badge">—</span>
        <button class="btn" id="tree-toggle" style="margin-left:auto;">Show sanitized</button>
      </div>
      <div class="panel-body">
        <div id="tree-output"><span class="empty">Tree will appear here.</span></div>
      </div>
      <div class="issues-section" id="issues-section" style="display:none;">
        <h3 id="issues-heading">Issues</h3>
        <div id="issue-items"></div>
      </div>
    </div>

    <!-- Panel 3: Sanitized output -->
    <div class="panel">
      <div class="panel-header">
        <h2>Sanitized YAML</h2>
        <span id="sanitized-badge" class="badge">—</span>
        <button class="btn" id="copy-btn" style="margin-left:auto;" title="Copy sanitized YAML">Copy</button>
      </div>
      <div class="sanitized-panel-body">
        <div id="sanitized-output"><span class="empty">Sanitized output will appear here.</span></div>
        <div class="fixes-section" id="fixes-section" style="display:none;">
          <h3>Applied fixes</h3>
          <div id="fix-items"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/* ── DOM refs ─────────────────────────────────────────────────────────────── */
const editor         = document.getElementById('editor');
const exampleSelect  = document.getElementById('example-select');
const statusBadge    = document.getElementById('status-badge');
const spinner        = document.getElementById('spinner');
const treeOutput     = document.getElementById('tree-output');
const treeBadge      = document.getElementById('tree-badge');
const treeToggle     = document.getElementById('tree-toggle');
const inputBadge     = document.getElementById('input-badge');
const issuesSection  = document.getElementById('issues-section');
const issuesHeading  = document.getElementById('issues-heading');
const issueItems     = document.getElementById('issue-items');
const sanitizedOut   = document.getElementById('sanitized-output');
const sanitizedBadge = document.getElementById('sanitized-badge');
const fixesSection   = document.getElementById('fixes-section');
const fixItems       = document.getElementById('fix-items');
const copyBtn        = document.getElementById('copy-btn');

let debounceTimer      = null;
let lastSanitized      = '';
let lastResult         = null;
let showingOriginalTree = true;

/* ── Examples ─────────────────────────────────────────────────────────────── */
async function loadExamples() {
  try {
    const res = await fetch('/api/examples');
    const examples = await res.json();
    examples.forEach((ex, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = ex.name;
      opt.title = ex.description || '';
      exampleSelect.appendChild(opt);
    });
    window._examples = examples;
  } catch (e) { console.error('Failed to load examples', e); }
}

exampleSelect.addEventListener('change', () => {
  const idx = exampleSelect.value;
  if (idx === '') { resetUI(); return; }
  const ex = window._examples && window._examples[parseInt(idx)];
  if (ex) { editor.value = ex.yaml; triggerAnalysis(); }
});

/* ── Analysis ─────────────────────────────────────────────────────────────── */
editor.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(triggerAnalysis, 320);
});

async function triggerAnalysis() {
  const src = editor.value;
  if (!src.trim()) { resetUI(); return; }
  setLoading(true);
  try {
    const res = await fetch('/api/sanitize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ yaml: src }),
    });
    if (!res.ok) throw new Error(await res.text());
    renderResult(await res.json());
  } catch (e) {
    treeOutput.textContent = 'Error: ' + e.message;
  } finally {
    setLoading(false);
  }
}

/* ── Render ───────────────────────────────────────────────────────────────── */
function renderResult(data) {
  lastSanitized = data.sanitized || '';
  lastResult    = data;

  const origErrCount  = (data.original_errors  || []).length;
  const origLintCount = (data.original_lint_issues || []).length;

  // Status badge reflects original input state
  if (origErrCount > 0) {
    statusBadge.className = 'status-badge errors';
    statusBadge.textContent = origErrCount + ' parse error' + (origErrCount !== 1 ? 's' : '');
  } else if (origLintCount > 0) {
    statusBadge.className = 'status-badge lint';
    statusBadge.textContent = origLintCount + ' lint issue' + (origLintCount !== 1 ? 's' : '');
  } else {
    statusBadge.className = 'status-badge clean';
    statusBadge.textContent = 'clean';
  }

  // Input badge
  inputBadge.className = 'badge ' + (origErrCount > 0 ? 'has-errors' : origLintCount > 0 ? 'has-lint' : 'no-errors');
  inputBadge.textContent = origErrCount > 0
    ? origErrCount + ' error' + (origErrCount !== 1 ? 's' : '')
    : origLintCount > 0 ? origLintCount + ' lint' : 'OK';

  // Tree panel: default to original
  showingOriginalTree = true;
  updateTreePanel(data);

  // Issues: always show original
  renderIssues(data.original_errors || [], data.original_lint_issues || []);

  // Sanitized output
  sanitizedOut.innerHTML = '';
  if (data.sanitized) {
    const pre = document.createElement('pre');
    pre.style.cssText = 'padding:12px;font-family:var(--mono);font-size:13px;line-height:1.65;';
    pre.textContent = data.sanitized;
    sanitizedOut.appendChild(pre);
  }

  // Sanitized badge
  sanitizedBadge.className = 'badge ' + (data.parse_clean && data.lint_clean ? 'no-errors' : data.parse_clean ? 'has-lint' : 'has-errors');
  sanitizedBadge.textContent = data.parse_clean && data.lint_clean ? 'clean' : data.parse_clean ? 'lint only' : 'has errors';

  // Fixes
  renderFixes(data.fixes || []);
}

/* ── Tree panel ───────────────────────────────────────────────────────────── */
function updateTreePanel(data) {
  data = data || lastResult;
  if (!data) return;

  const treeText = showingOriginalTree
    ? (data.original_tree_text || data.tree_text || '')
    : (data.tree_text || '');
  const errors = showingOriginalTree
    ? (data.original_errors || [])
    : (data.errors || []);

  renderTree(treeText);

  const errCount = errors.length;
  treeBadge.className = 'badge ' + (errCount > 0 ? 'has-errors' : 'no-errors');
  treeBadge.textContent = errCount > 0
    ? errCount + ' ERROR' + (errCount !== 1 ? 's' : '')
    : 'No errors';

  if (showingOriginalTree) {
    treeToggle.textContent = 'Show sanitized';
    treeToggle.classList.remove('active');
  } else {
    treeToggle.textContent = 'Show original';
    treeToggle.classList.add('active');
  }
}

treeToggle.addEventListener('click', () => {
  showingOriginalTree = !showingOriginalTree;
  updateTreePanel();
});

/* ── Pretty-print sexp ────────────────────────────────────────────────────── */
function prettyTree(sexp) {
  let out = '', depth = 0, i = 0;
  const ind = () => '  '.repeat(depth);
  while (i < sexp.length) {
    const ch = sexp[i];
    if (ch === '(') {
      if (out.length > 0 && out[out.length - 1] !== '\n') out += '\n' + ind();
      out += ch; depth++; i++;
    } else if (ch === ')') {
      depth--; out += ch; i++;
    } else if (ch === ' ') {
      if (i + 1 < sexp.length && sexp[i + 1] === '(') {
        out += '\n' + ind(); i++;
      } else { out += ch; i++; }
    } else { out += ch; i++; }
  }
  return out;
}

function renderTree(treeText) {
  if (!treeText) {
    treeOutput.innerHTML = '<span class="empty">No tree available.</span>';
    return;
  }
  const pretty = prettyTree(treeText);
  const html = pretty
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/[()]/g, m => `<span class="tn-paren">${m}</span>`)
    .replace(/(<span class="tn-paren">\(<\/span>)(ERROR\b)/g,
      '$1<span class="tn-error">$2</span>')
    .replace(/(<span class="tn-paren">\(<\/span>)(MISSING\b)/g,
      '$1<span class="tn-missing">$2</span>')
    .replace(/(<span class="tn-paren">\(<\/span>)([a-z][a-z0-9_]*)/g,
      '$1<span class="tn-node">$2</span>')
    .replace(/\b([a-z][a-z0-9_]*)(:<\/span>)/g,
      '<span class="tn-field">$1</span>$2')
    .replace(/\b([a-z][a-z0-9_]*):/g,
      '<span class="tn-field">$1</span>:')
    .replace(/&quot;([^&]*)&quot;/g,
      '<span style="color:#888;font-style:italic;">&quot;$1&quot;</span>');
  treeOutput.innerHTML = html;
}

/* ── Issues ───────────────────────────────────────────────────────────────── */
function renderIssues(errors, lintIssues) {
  const total = errors.length + lintIssues.length;
  if (total === 0) { issuesSection.style.display = 'none'; return; }

  issuesSection.style.display = '';
  issuesSection.className = 'issues-section' + (errors.length === 0 ? ' lint-only' : '');

  const parts = [];
  if (errors.length > 0)     parts.push(errors.length + ' ERROR node' + (errors.length !== 1 ? 's' : ''));
  if (lintIssues.length > 0) parts.push(lintIssues.length + ' lint issue' + (lintIssues.length !== 1 ? 's' : ''));
  issuesHeading.textContent = parts.join(' · ');

  issueItems.innerHTML = '';
  errors.forEach(e => {
    const div = document.createElement('div');
    div.className = 'issue-item';
    const loc  = `L${e.start_row + 1}:${e.start_col + 1}`;
    const text = e.text ? ` <em>${escHtml(e.text.slice(0, 50))}</em>` : '';
    div.innerHTML = `<span class="loc">${loc}</span><span class="type-tag ${e.type.toLowerCase()}">${e.type}</span>${text}`;
    issueItems.appendChild(div);
  });
  lintIssues.forEach(li => {
    const div = document.createElement('div');
    div.className = 'issue-item';
    div.innerHTML =
      `<span class="type-tag lint">lint</span>` +
      `<span class="fix-rule" style="background:#e8f4fd;color:#1a6ea8;">${escHtml(li.rule)}</span>` +
      escHtml(li.description);
    issueItems.appendChild(div);
  });
}

/* ── Fixes ────────────────────────────────────────────────────────────────── */
function renderFixes(fixes) {
  if (!fixes || fixes.length === 0) { fixesSection.style.display = 'none'; return; }
  fixesSection.style.display = '';
  fixItems.innerHTML = '';
  fixes.forEach(f => {
    const div = document.createElement('div');
    div.className = 'fix-item';
    div.innerHTML =
      `<span class="fix-rule">${escHtml(f.rule)}</span>` +
      `<span class="fix-desc">${escHtml(f.description)}</span>` +
      `<div class="fix-diff">` +
        `<div class="fix-before">${escHtml(f.before)}</div>` +
        `<div class="fix-after">${escHtml(f.after)}</div>` +
      `</div>`;
    fixItems.appendChild(div);
  });
}

/* ── Helpers ──────────────────────────────────────────────────────────────── */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setLoading(on) { spinner.classList.toggle('hidden', !on); }
function resetUI() {
  statusBadge.className = 'status-badge idle'; statusBadge.textContent = 'idle';
  treeOutput.innerHTML = '<span class="empty">Tree will appear here.</span>';
  sanitizedOut.innerHTML = '<span class="empty">Sanitized output will appear here.</span>';
  issuesSection.style.display = 'none'; fixesSection.style.display = 'none';
  treeBadge.className = 'badge'; treeBadge.textContent = '—';
  inputBadge.className = 'badge'; inputBadge.textContent = '—';
  sanitizedBadge.className = 'badge'; sanitizedBadge.textContent = '—';
  treeToggle.textContent = 'Show sanitized'; treeToggle.classList.remove('active');
  lastSanitized = ''; lastResult = null;
}

/* ── Copy ─────────────────────────────────────────────────────────────────── */
copyBtn.addEventListener('click', () => {
  if (!lastSanitized) return;
  navigator.clipboard.writeText(lastSanitized).then(() => {
    copyBtn.textContent = 'Copied!'; copyBtn.classList.add('copied');
    setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 1500);
  });
});

/* ── Init ─────────────────────────────────────────────────────────────────── */
loadExamples();
</script>
</body>
</html>
